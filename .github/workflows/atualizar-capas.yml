name: Atualizar capas dos livros

# Roda quando você clicar em "Run workflow" na aba Actions do GitHub.
# Não roda sozinho a cada push, pra evitar loop (o próprio workflow
# altera o index.html e faz um commit).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embutir-capas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Buscar capas e embutir no index.html
        run: python3 baixar_capas.py index.html index.html

      - name: Salvar o index.html atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "Nada novo para commitar." || git commit -m "Atualiza capas embutidas"
          git push
